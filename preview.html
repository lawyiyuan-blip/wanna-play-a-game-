<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prom Quest</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// GAME STATE
let gameState = "start";

// PLAYER
let player = {
  x: 100,
  y: 300,
  w: 40,
  h: 40,
  dx: 0,
  dy: 0,
  jumping: false
};

let gravity = 0.6;
let cameraX = 0;

// CONTROLS
let keys = {};
document.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (gameState === "start" && e.code === "Enter") {
    gameState = "play";
  }

  if (e.code === "Space" && !player.jumping) {
    player.dy = -12;
    player.jumping = true;
  }
});
document.addEventListener("keyup", e => keys[e.code] = false);

// COLLECTIBLES
let items = [
  {x:400,y:300,type:"shoe"},
  {x:700,y:300,type:"chess"},
  {x:1000,y:300,type:"book"}
];

// OBSTACLES
let obstacles = [
  {x:600,y:310,w:40,h:40},
  {x:900,y:310,w:40,h:40}
];

// FINAL BLOCK
let block = {x:1300,y:200,w:50,h:50};

let showQuestion = false;

// CLICK YES
canvas.addEventListener("click", e => {
  if (showQuestion) {
    alert("She said YES ❤️");
  }
});

function update() {
  if (gameState !== "play") return;

  // movement
  player.dx = 0;
  if (keys["ArrowRight"]) player.dx = 5;
  if (keys["ArrowLeft"]) player.dx = -5;

  player.x += player.dx;

  // gravity
  player.dy += gravity;
  player.y += player.dy;

  if (player.y > 300) {
    player.y = 300;
    player.dy = 0;
    player.jumping = false;
  }

  // camera follow
  cameraX = player.x - 200;

  // collect items
  items = items.filter(item => {
    return !(player.x < item.x+20 &&
             player.x+player.w > item.x &&
             player.y < item.y+20 &&
             player.y+player.h > item.y);
  });

  // obstacle hit
  obstacles.forEach(o => {
    if (player.x < o.x+o.w &&
        player.x+player.w > o.x &&
        player.y < o.y+o.h &&
        player.y+player.h > o.y) {
          player.x -= 30; // knockback
    }
  });

  // hit block
  if (
    player.x < block.x + block.w &&
    player.x + player.w > block.x &&
    player.y < block.y + block.h &&
    player.y + player.h > block.y
  ) {
    showQuestion = true;
    gameState = "end";
  }
}

function drawStart() {
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "60px Arial";
  ctx.fillText("SUPER YI QUEST", canvas.width/2 - 250, 200);

  ctx.font = "30px Arial";
  ctx.fillText("PRESS ENTER TO START", canvas.width/2 - 200, 300);
}

function drawGame() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // sky
  ctx.fillStyle = "skyblue";
  ctx.fillRect(0,0,2000,canvas.height);

  // ground
  ctx.fillStyle = "green";
  ctx.fillRect(0,340,2000,100);

  // player
  ctx.fillStyle = "black";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // items
  items.forEach(i=>{
    ctx.fillStyle = "gold";
    ctx.fillRect(i.x,i.y,20,20);
  });

  // obstacles
  ctx.fillStyle = "red";
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,o.y,o.w,o.h);
  });

  // block
  ctx.fillStyle = "yellow";
  ctx.fillRect(block.x,block.y,block.w,block.h);

  ctx.restore();
}

function drawEnd() {
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "50px Arial";
  ctx.fillText("Will you go to Prom with me?", 200,200);

  ctx.font = "30px Arial";
  ctx.fillText("> YES (click)", 300,300);
  ctx.fillText("DEFINITELY YES", 300,350);
}

function loop() {
  update();

  if (gameState === "start") drawStart();
  if (gameState === "play") drawGame();
  if (gameState === "end") drawEnd();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
